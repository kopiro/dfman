name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (does not publish a release)
        default: v0.0.0
        required: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, platform: darwin, arch: arm64}
          - {os: macos-latest, platform: darwin, arch: amd64}
          - {os: ubuntu-latest, platform: linux, arch: arm64}
          - {os: ubuntu-latest, platform: linux, arch: amd64}
          - {os: windows-latest, platform: windows, arch: arm64, msvc: amd64_arm64}
          - {os: windows-latest, platform: windows, arch: amd64, msvc: amd64}
    runs-on: ${{ matrix.os }}
    env:
      DFMAN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || 'v0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -OutputDirectory dist/windows-${{ matrix.arch }} -Arch ${{ matrix.arch }} -Version $env:DFMAN_VERSION
      - if: matrix.platform == 'darwin'
        run: bash scripts/build-macos.sh dist/darwin-${{ matrix.arch }} ${{ matrix.arch }}
      - if: matrix.platform == 'linux'
        run: GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$DFMAN_VERSION" -o dist/linux-${{ matrix.arch }}/dfman ./cmd/dfman
      - if: matrix.platform == 'darwin'
        run: bash scripts/package-macos.sh "$DFMAN_VERSION" ${{ matrix.arch }}
      - if: matrix.platform == 'linux'
        run: bash scripts/package-linux.sh "$DFMAN_VERSION" ${{ matrix.arch }}
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version $env:DFMAN_VERSION -Arch ${{ matrix.arch }}
      - if: matrix.platform == 'darwin' || (matrix.platform == 'linux' && matrix.arch == 'amd64')
        run: bash scripts/smoke-package.sh "$DFMAN_VERSION" ${{ matrix.arch }}
      - if: matrix.platform == 'windows' && matrix.arch == 'amd64'
        shell: pwsh
        run: ./scripts/smoke-package-windows.ps1 -Version $env:DFMAN_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: dfman-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.deb
            dist/*_setup.exe
  checksums:
    needs: [test, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dfman-*
          merge-multiple: true
          path: packages
      - run: cd packages && sha256sum *.pkg *.deb *.exe > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: packages/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vX.Y.Z"; exit 1; }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          # Do not mutate an already published release on workflow reruns.
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]] || exit 0
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
